<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Login - Sanmugavel B</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── AUTH PAGE — built on top of the shared VLSI theme (styles.css) ── */
        body.auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 5vw, 2.5rem);
        }

        .auth-shell { position: relative; z-index: 1; width: 100%; max-width: 460px; }

        .auth-card {
            background: var(--gradient-card);
            border: 1px solid var(--color-border-bright);
            border-radius: var(--radius-2xl);
            padding: clamp(1.75rem, 6vw, 2.75rem) clamp(1.5rem, 6vw, 2.5rem);
            box-shadow: var(--shadow-xl), var(--glow-soft);
            position: relative;
            overflow: hidden;
            animation: slideUp .5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

        .auth-pins { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.75rem; }
        .auth-pins span {
            width: 26px; height: 4px; border-radius: 2px;
            background: linear-gradient(90deg, #00e5c8, #0099ff);
            opacity: .55;
            animation: pinBlink 1.8s ease infinite alternate;
        }
        .auth-pins span:nth-child(1){animation-delay:0s}
        .auth-pins span:nth-child(2){animation-delay:.15s}
        .auth-pins span:nth-child(3){animation-delay:.3s}
        .auth-pins span:nth-child(4){animation-delay:.45s}
        .auth-pins span:nth-child(5){animation-delay:.6s}
        .auth-pins span:nth-child(6){animation-delay:.75s}

        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-id {
            font-family: var(--font-mono); font-size: .72rem; letter-spacing: .28em;
            color: var(--color-primary); opacity: .7; margin-bottom: .9rem;
        }
        .auth-icon {
            font-size: 2.4rem; color: var(--color-primary);
            filter: drop-shadow(0 0 10px var(--color-primary));
            margin-bottom: .6rem; display: block;
            animation: chipPulse 3s ease-in-out infinite;
        }
        .auth-title {
            font-family: var(--font-head); font-size: clamp(1.6rem, 5vw, 2.1rem);
            font-weight: 800; margin-bottom: .35rem;
        }
        .auth-sub {
            font-family: var(--font-mono); font-size: .8rem;
            color: var(--color-text-secondary); letter-spacing: .04em;
        }

        .auth-tabs {
            display: flex; gap: .5rem; background: rgba(0,0,0,.25);
            border: 1px solid var(--color-border); border-radius: var(--radius-lg);
            padding: .35rem; margin-bottom: 1.75rem;
        }
        .auth-tab {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: .4rem;
            padding: .65rem .5rem; border: none; border-radius: var(--radius-md);
            background: transparent; color: var(--color-text-secondary);
            font-family: var(--font-head); font-weight: 700; font-size: .78rem;
            letter-spacing: .06em; text-transform: uppercase;
            cursor: pointer; transition: all var(--transition-fast);
        }
        .auth-tab.active {
            background: var(--gradient-primary); color: #060e14;
            box-shadow: var(--glow-primary);
        }
        .auth-tab:hover:not(.active) { background: var(--color-hover); color: var(--color-primary); }

        .auth-alert {
            display: none; padding: .75rem 1rem; border-radius: var(--radius-md);
            font-size: .85rem; margin-bottom: 1rem; font-family: var(--font-body);
            animation: shake .4s ease;
        }
        .auth-alert-error { background: rgba(255,77,106,.12); color: var(--color-error); border: 1px solid rgba(255,77,106,.3); }
        .auth-alert-success { background: rgba(34,211,94,.12); color: var(--color-success); border: 1px solid rgba(34,211,94,.3); }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn .35s ease; }

        .form-group label {
            display: block; margin-bottom: .5rem; font-family: var(--font-head);
            font-size: .78rem; letter-spacing: .05em; text-transform: uppercase;
            color: var(--color-text-secondary); font-weight: 600;
        }
        .auth-input-wrap { position: relative; }
        .auth-input-wrap i {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            color: var(--color-text-secondary); font-size: .9rem; pointer-events: none;
        }
        .auth-input-wrap .form-control { padding-left: 2.7rem; }

        .auth-submit { width: 100%; justify-content: center; margin-top: .5rem; }

        .auth-visitor-copy {
            color: var(--color-text-secondary); font-size: .9rem; line-height: 1.7;
            text-align: center; margin-bottom: 1.5rem;
        }

        .auth-footer {
            text-align: center; margin-top: 1.75rem; padding-top: 1.25rem;
            border-top: 1px solid var(--color-border);
            font-family: var(--font-mono); font-size: .72rem;
            color: var(--color-text-secondary); letter-spacing: .05em;
        }

        @media (max-width: 480px) {
            .auth-pins span { width: 20px; }
            .auth-tab { font-size: .68rem; padding: .6rem .3rem; gap: .25rem; }
        }
        @media (max-width: 360px) {
            .auth-tab i { display: none; }
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-pins" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="auth-header">
                <span class="auth-id">ECE · MIT · AUTH MODULE</span>
                <i class="fas fa-microchip auth-icon"></i>
                <h1 class="auth-title gradient-text">Sanmugavel B</h1>
                <p class="auth-sub">Full Stack Developer · AIoT &amp; Embedded Systems</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" onclick="switchTab('admin')">
                    <i class="fas fa-user-shield"></i> Admin Login
                </button>
                <button type="button" class="auth-tab" onclick="switchTab('visitor')">
                    <i class="fas fa-eye"></i> Visitor Mode
                </button>
            </div>

            <div id="error-message" class="auth-alert auth-alert-error"></div>
            <div id="success-message" class="auth-alert auth-alert-success"></div>

            <!-- Admin Login Form -->
            <div id="admin-form" class="auth-form active">
                <form onsubmit="handleAdminLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control" id="admin-email" required placeholder="Enter admin email" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="auth-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="admin-password" required placeholder="Enter password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg auth-submit">
                        <i class="fas fa-sign-in-alt"></i> Login as Admin
                    </button>
                </form>
            </div>

            <!-- Visitor Mode -->
            <div id="visitor-form" class="auth-form">
                <p class="auth-visitor-copy">
                    Browse the portfolio in read-only mode — view every project, experience entry and skill, no login required.
                </p>
                <button type="button" onclick="enterVisitorMode()" class="btn btn-secondary btn-lg auth-submit">
                    <i class="fas fa-eye"></i> Enter as Visitor
                </button>
            </div>

            <div class="auth-footer">© 2026 Sanmugavel B · All Rights Reserved</div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const adminForm = document.getElementById('admin-form');
            const visitorForm = document.getElementById('visitor-form');
            const tabBtns = document.querySelectorAll('.auth-tab');

            if (tab === 'admin') {
                adminForm.classList.add('active');
                visitorForm.classList.remove('active');
                tabBtns[0].classList.add('active');
                tabBtns[1].classList.remove('active');
            } else {
                visitorForm.classList.add('active');
                adminForm.classList.remove('active');
                tabBtns[1].classList.add('active');
                tabBtns[0].classList.remove('active');
            }

            hideMessages();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => successDiv.style.display = 'none', 3000);
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        function handleAdminLogin(event) {
            event.preventDefault();

            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            if (email === 'sanmugavelb1@gmail.com' && password === 'Sanmugavel') {
                const user = {
                    email: email,
                    role: 'admin',
                    name: 'Sanmugavel B',
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('portfolioUser', JSON.stringify(user));
                showSuccess('Login successful! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showError('Invalid email or password. Please try again.');
            }
        }

        function enterVisitorMode() {
            const user = {
                role: 'visitor',
                name: 'Guest',
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('portfolioUser', JSON.stringify(user));
            showSuccess('Welcome! Redirecting to portfolio...');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Check if already logged in
        const currentUser = localStorage.getItem('portfolioUser');
        if (currentUser) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
